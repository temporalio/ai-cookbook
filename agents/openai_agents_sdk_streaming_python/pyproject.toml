[project]
name = "cookbook-streaming-openai-agent"
version = "0.1"
description = "Durable Agent using the OpenAI Agents SDK Temporal integration with Workflow Streams for real-time tool-calling visibility"
authors = [{ name = "Temporal Technologies Inc", email = "sdk@temporal.io" }]
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = "MIT"
dependencies = [
    "temporalio>=1.27.0,<2",
    "openai-agents>=0.1.0",
    # temporalio.contrib.openai_agents imports temporalio.contrib.opentelemetry
    # unconditionally as of this temporalio floor; neither is declared as a
    # transitive dependency of temporalio itself.
    "opentelemetry-api",
    "opentelemetry-sdk",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-timeout>=2.4.0",
    "pytest-asyncio>=0.26.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
