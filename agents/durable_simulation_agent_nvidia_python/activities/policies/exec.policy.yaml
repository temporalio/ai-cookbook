# OpenShell policy v1 for the EXEC sandbox: it runs the code the model wrote and has no network rules at all.
# A sandbox without network rules gets no baseline filesystem paths, so the system paths are listed explicitly.
# /opt/site holds the site layer and the catalog the sandbox image ships (read-only); sceneops is installed under /usr.
version: 1
filesystem_policy:
  include_workdir: true            # /sandbox, read-write: the agent's layers and the composed scene
  read_only:
    - /usr
    - /lib
    - /etc
    - /proc
    - /dev/urandom
    - /var/log
    - /opt/site
  read_write:
    - /tmp
    - /dev/null
landlock:
  compatibility: hard_requirement  # fail closed
network_policies: {}
