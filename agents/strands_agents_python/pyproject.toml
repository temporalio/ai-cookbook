[project]
name = "cookbook-strands-plugin-agent"
version = "0.1"
description = "Durable Agent using the Strands Agents SDK Temporal plugin with AWS Bedrock and an MCP server"
authors = [{ name = "Temporal Technologies Inc", email = "sdk@temporal.io" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = [
    "temporalio>=1.36.0,<2",
    "temporalio-strands-agents[mcp]>=1.0.0,<2",
    "strands-agents>=1.63.0",
    "mcp>=2.0.0,<3",
    "requests>=2.31.0",
    # Required by the AWS SSO ("aws login") credential provider.
    "botocore[crt]>=1.34.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.26.0",
    "pytest-timeout>=2.4.0",
]

[tool.setuptools]
py-modules = []  # No modules to install, just dependencies

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv]
# This table replaces the repo-root uv.toml for this recipe, so it repeats the two-week cooldown. The Temporal packages
# are exempted up to the temporalio-strands-agents 1.0.0 GA release (2026-11-18), which needs temporalio 1.36.
# Drop this table once these releases are older than two weeks (after 2026-12-02).
exclude-newer = "2 weeks"
exclude-newer-package = { temporalio = "2026-11-19T00:00:00Z", temporalio-strands-agents = "2026-11-19T00:00:00Z", temporalio-mcp = "2026-11-19T00:00:00Z" }
